apiVersion: batch/v1
kind: Job
metadata:
  name: nodefind2
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      containers:
      - name: c
        image: curlimages/curl:8.10.1
        command: ["/bin/sh","-c"]
        args:
        - |
          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          echo "##FETCH"
          curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/chatly-strapi/pods?labelSelector=app%3Dchatly-strapi-backend" -o /tmp/p.json -w "http=%{http_code}\n"
          echo "size=$(wc -c < /tmp/p.json)"
          echo "##HEAD"
          head -c 300 /tmp/p.json
          echo
          echo "##NODENAMES"
          grep -oE '"nodeName": *"[^"]*"' /tmp/p.json | sort | uniq -c
          echo "##PHASES"
          grep -oE '"phase": *"[^"]*"' /tmp/p.json | sort | uniq -c
          echo "##PODIPS"
          grep -oE '"podIP": *"[^"]*"' /tmp/p.json | sort | uniq -c
          echo "##PODNAMES"
          grep -oE '"name": *"chatly-strapi-backend-[0-9]+-[a-z0-9]+"' /tmp/p.json | sort -u
          echo "##ALLNODES"
          curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/api/v1/nodes" -o /tmp/n.json -w "nodes_http=%{http_code}\n"
          grep -oE '"name": *"anubis[^"]*"' /tmp/n.json | sort -u | head -40
          echo "##END##"
