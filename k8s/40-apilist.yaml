apiVersion: batch/v1
kind: Job
metadata:
  name: apilist
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      containers:
      - name: c
        image: curlimages/curl:8.10.1
        command: ["/bin/sh","-c"]
        args:
        - |
          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          echo "## namespaces"
          curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces" | tr ',' '\n' | grep -E '"name"' | sed 's/.*"name": *"//;s/".*//' | sort -u
          echo "## deployments"
          for ns in chatly chatly-strapi xipe charon-chatly charon-make anpu-commercial imagine-blog auth; do
            echo "--- ns=$ns"
            curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/apis/apps/v1/namespaces/$ns/deployments" | tr '{' '\n' | grep -E '"(name|image)"' | head -40
          done
          echo "## done"
